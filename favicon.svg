<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="#080c14" stroke="url(#portalGrad)" stroke-width="4"/>
  <!-- Mysterious orbital rings -->
  <ellipse cx="50" cy="50" rx="38" ry="18" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" transform="rotate(-30 50 50)"/>
  <ellipse cx="50" cy="50" rx="38" ry="18" fill="none" stroke="rgba(168, 85, 247, 0.4)" stroke-width="2" transform="rotate(30 50 50)"/>
  <!-- Chronos Hourglass Portal -->
  <path d="M30 26 L70 26 L54 48 L70 74 L30 74 L46 48 Z" fill="none" stroke="url(#portalGrad)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Inner cosmic core -->
  <circle cx="50" cy="48" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
  <polygon points="43,62 57,62 50,71" fill="#ec4899"/>
</svg>
